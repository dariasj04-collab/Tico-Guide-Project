<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="media/tico-guide-logo.svg" type="image/svg+xml">
    <title>Tico Guide</title>

</head>

<body>


    <!---------------- Header ------------------>

    <header class="header">
        <div class="header__block block">
            <a href="index.html" class="header__brand">
                <img src="media/tico-guide-logo.svg" class="header__logo" alt="">
                <span class="header__slogan">
                    <span class="heading--h4">Tico Guide</span>
                    <span class="eyebrow">Pura vida</span>
                </span>
            </a>

            <div>
                <ul class="header__nav">
                    <li><a class="header__nav-menu header__nav-menu--active" href="index.html"
                            aria-current="page">Inicio</a></li>
                    <li><a class="header__nav-menu" href="explora.html">Explora</a></li>
                    <li><a class="header__nav-menu" href="planifica.html">Planifica</a></li>
                    <li><a class="header__nav-menu" href="muevete.html">Muévete</a></li>
                    <li><a class="header__nav-menu" href="descubre.html">Descubre</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main>

        <!------------ Hero Banner --------------->

        <section class="hero">
            <div class="hero__background">
                <div class="hero__block block">
                    <p class="eyebrow">Explora Costa Rica como local</p>
                    <h1>Conocé Costa Rica más allá de la postal.</h1>
                    <p>Destinos, rutas y consejos contados por quienes vivimos aquí.</p>
                    <div class="hero__links">
                        <a class="btn btn--light" href="explora.html">Explorar destinos <i
                                class="ri-arrow-right-long-line"></i></a>
                        <a class="btn btn--outline" href="planifica.html">Planificar mi viaje <i
                                class="ri-arrow-right-long-line"></i></a>
                    </div>
                </div>
            </div>

            <div class="hero__search block">
                <h2 class="heading--h4">¿Qué querés descubrir?</h2>
              <form class="form" action="#" method="post">

                        <div class="form__field">
                            <label class="eyebrow" for="interes">Interés</label>
                            <select name="interes" id="interes">
                                <option value="" selected disabled>Elegí una opción</option>
                                <option value="Naturaleza">Naturaleza</option>
                                <option value="Aventura">Aventura</option>
                                <option value="Playa">Playa</option>
                                 <option value="Cultura">Cultura</option>
                            </select>
                        </div>
                        <div class="form__field">
                            <label class="eyebrow" for="region">Región</label>
                            <select name="region" id="region">
                                <option value="" selected disabled>Elegí una opción</option>
                                <option value="Toda Costa Rica">Toda Costa Rica</option>
                                <option value="Valle Central">Valle Central</option>
                                <option value="Caribe">Caribe</option>
                            </select>
                        </div>
                        <div class="form__field">
                            <label class="eyebrow" for="duracion">Duración</label>
                            <select name="duracion" id="duracion">
                                <option value="" selected disabled>Elegí una opción</option>
                                <option value="3–5 días">3–5 días</option>
                                <option value="7 días">7 días</option>
                                <option value="14 días">14 días</option>
                            </select>
                        </div>
                       <!--Preguntar a pedro sobre envolver el form en un search por el button que es un search-->
                        <button class="btn btn--green" type="submit">Buscar<i
                                class="ri-arrow-right-long-line"></i></button>
                    </form>


            </div>
        </section>



    </main>
    <footer></footer>

</body>

</html>
